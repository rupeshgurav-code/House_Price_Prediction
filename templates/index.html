<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>House Price Predictor</title>

    <link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='image.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="background"></div>

<div class="app-container">

    <!-- HEADER -->
    <div class="header">
        <div>
            <h1>🏠 House Price Predictor</h1>
            <p>AI-powered real estate price estimation</p>
        </div>

        <div class="user-box">
            <span>Welcome, <b>{{ username }}</b></span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>

    <!-- FORM CARD -->
    <div class="card">

        <form id="predictForm">

            <div class="grid">

                <input name="area" placeholder="Area (sq ft)" required>
                <input name="bedrooms" placeholder="Bedrooms" required>
                <input name="bathrooms" placeholder="Bathrooms" required>
                <input name="floor" placeholder="Floor Number" required>
                <input name="total_floors" placeholder="Total Floors" required>
                <input name="furnished" placeholder="Furnished (0-2)" required>
                <input name="balcony" placeholder="Balconies" required>
                <input name="age_of_house" placeholder="Age of House" required>
                <input name="parking" placeholder="Parking Spots" required>
                <input name="near_school" placeholder="Near School (0/1)" required>
                <input name="near_metro" placeholder="Near Metro (0/1)" required>

            </div>

            <button type="submit" id="predictBtn">
                🔮 Predict Price
            </button>

        </form>

        <!-- RESULT BOX -->
        <div id="result" class="result-box"></div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
